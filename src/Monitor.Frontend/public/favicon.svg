<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pulse" x1="4" y1="16" x2="28" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="1" y="1" width="30" height="30" rx="7" ry="7" fill="url(#bg)"/>
  <!-- Monitor frame -->
  <rect x="5" y="6" width="22" height="16" rx="2.5" ry="2.5" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
  <!-- Screen inner -->
  <rect x="6.5" y="7.5" width="19" height="13" rx="1.5" ry="1.5" fill="rgba(15,23,42,0.35)"/>
  <!-- Pulse / heartbeat line -->
  <polyline points="7.5,16 10,16 11.5,11 13,21 14.5,13 16,16 18.5,16 20,10 21.5,22 23,14 24.5,16" 
            fill="none" stroke="url(#pulse)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Monitor stand -->
  <rect x="13" y="22.5" width="6" height="2" rx="0.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="11" y="24.5" width="10" height="1.5" rx="0.75" fill="rgba(255,255,255,0.4)"/>
  <!-- Status dot -->
  <circle cx="16" cy="9.5" r="1" fill="#4ade80"/>
</svg>
